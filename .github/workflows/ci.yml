# CI for this repo is the shared, versioned workflow from python-project-template.
# Pipeline changes ship as template releases and arrive here through `copier update`.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    uses: lloydbrian/python-project-template/.github/workflows/python-ci.yml@v2.0.0-rc.1
    with:
      image: true
      smoke: true
      mise-version: "2026.11.14"
