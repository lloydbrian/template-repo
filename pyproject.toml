[project]
name = "template-sample-app"
version = "0.1.0"
description = "Sample FastAPI service built on the team Python scaffold"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Lloyd D." }]
dependencies = [
  # Web service (this repo is a service, so the framework is a runtime dependency)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # HTTP + retries (common for model/tool calls)
  "httpx>=0.27",
  "tenacity>=9.0",
  # Validation, configuration and environment files
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  # CLI and readable output
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]       # optional features: uv sync --extra ai
ai = ["numpy>=2.3", "pandas>=2.3"]

[project.scripts]
template-sample-app = "template_sample_app.cli:app"

[dependency-groups]                   # tooling: installed by `uv sync`, never shipped
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.17",
  "mypy>=1.18",
  "pre-commit>=4.0",
]
security = ["pip-audit>=2.7", "bandit>=1.8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "S", "RUF"]   # S = security rules
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                 # assert is how pytest works

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["template_sample_app"]
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov --cov-report=term-missing"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
markers = ["live: calls a real external API (needs credentials; excluded from CI)"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
