# .mise.toml — team baseline: Python pin, environment, and every quality gate as a task
[tools]
python = "3.14"          # keep in step with requires-python, the container base image and ruff/mypy targets

[env]
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"
PIP_DISABLE_PIP_VERSION_CHECK = "1"

[tasks.bootstrap]
description = "Create .venv, lock if needed, install deps and hooks (run once per clone)"
run = """
uv venv
[ -f uv.lock ] || uv lock
uv sync
uv run pre-commit install
"""

[tasks.format]
description = "Auto-format code"
run = "uv run ruff format ."

[tasks.lint]
description = "Lint (fails on issues)"
run = "uv run ruff check ."

[tasks.type]
description = "Static type check"
run = "uv run mypy"

[tasks.test]
description = "Unit tests with coverage"
run = "uv run pytest"

[tasks.security]
description = "Dependency and code security checks (fails on findings)"
run = """
uv run --group security pip-audit
uv run --group security bandit -q -r src
"""

[tasks.image]
description = "Build the production image with Podman"
run = "podman build -f .container/Containerfile --target prod -t template-sample-app:dev ."

[tasks.scan]
description = "Scan the built image for HIGH/CRITICAL vulnerabilities"
run = """
podman save -o /tmp/template-sample-app-image.tar template-sample-app:dev
trivy image --input /tmp/template-sample-app-image.tar --severity HIGH,CRITICAL --exit-code 1
"""

[tasks.ci]
description = "Exactly what CI runs"
run = """
uv sync --locked
uv run pre-commit run --all-files
uv run mypy
uv run pytest -m "not live"
"""
